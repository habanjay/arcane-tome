<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error | Arc Expense Tracker</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
	<style>
		:root { --ink: #17191f; --muted: #9ba1ae; --line: #e7ebf0; --blue: #287ff0; --teal: #2ab99d; }
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; background: #f1f3f6; color: var(--ink); font-family: "DM Sans", sans-serif; }
		.error-shell { display: grid; min-height: 100vh; place-items: center; padding: 32px 20px; }
		.error-panel { width: min(100%, 650px); padding: 52px clamp(22px, 7vw, 68px); border: 1px solid #fff; border-radius: 26px; background: #fff; box-shadow: 0 18px 45px #27364d0d; }
		.error-card { width: min(100%, 570px); margin: 0 auto; }
		.error-content { max-width: 460px; margin: 0 auto; text-align: center; }
		.error-code { margin: 0 0 12px; color: var(--blue); font-family: "Plus Jakarta Sans", sans-serif; font-size: clamp(58px, 8vw, 86px); line-height: .9; letter-spacing: -4px; }
		.error-title { margin: 0 0 10px; font-family: "Plus Jakarta Sans", sans-serif; font-size: 26px; letter-spacing: -1px; }
		.error-description { max-width: 420px; margin: 0 auto 28px; color: #8e96a3; font-size: 14px; line-height: 1.65; }
		.error-detail { margin: 28px 0 0; color: #b1b7c1; font-size: 11px; }
		.error-detail strong { color: #737c89; }
		@media (max-width: 480px) { .error-shell { padding: 20px 12px; } .error-panel { padding-top: 38px; padding-bottom: 32px; border-radius: 22px; } }
	</style>
</head>
<body>
	<main class="error-shell">
		<section class="error-panel" aria-labelledby="error-title">
			<div class="error-card">
				<div class="error-content"><p class="error-code">404</p><h1 class="error-title" id="error-title">That page drifted away.</h1><p class="error-description">We couldn’t find the page you were looking for. It may have moved, or the link may have expired.</p><p class="error-detail">Error reference: <strong>ARC-404-020</strong></p></div>
			</div>
		</section>
	</main>
</body>
</html>
